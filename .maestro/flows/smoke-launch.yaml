appId: org.bibletranslationtools.writer
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Welcome to BTT Writer"
    timeout: 120000
    optional: true
- runFlow:
    when:
      visible: "Slow Device"
    commands:
      - tapOn:
          text: "Don't show again"
          waitToSettleTimeoutMs: 500
      - tapOn:
          text: "Continue"
          waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "Migrate from Old App"
    timeout: 15000
    optional: true
- tapOn:
    text: "No"
    optional: true
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "Please create or login to your account."
    timeout: 300000
