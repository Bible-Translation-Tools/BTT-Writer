appId: org.bibletranslationtools.writer
---
- launchApp:
    clearState: true
- repeat:
    times: 3
    while:
      notVisible: "Migrate from Old App"
    commands:
      - tapOn:
          text: "Wait"
          optional: true
          waitToSettleTimeoutMs: 1000
          label: Recover from system ANR if shown
      - extendedWaitUntil:
          notVisible: "isn't responding"
          timeout: 60000
          optional: true
      - runFlow:
          when:
            visible: "isn't responding"
          commands:
            - launchApp
      - tapOn:
          text: "Don't show again"
          optional: true
          waitToSettleTimeoutMs: 200
          label: Dismiss slow-device warning if shown
      - tapOn:
          text: "Continue"
          optional: true
          waitToSettleTimeoutMs: 200
      - extendedWaitUntil:
          visible: "Migrate from Old App"
          timeout: 30000
          optional: true
      - runFlow:
          when:
            notVisible: "Migrate from Old App"
          commands:
            - launchApp
- extendedWaitUntil:
    visible: "Migrate from Old App"
    timeout: 5000
- tapOn:
    text: "No"
    waitToSettleTimeoutMs: 200
- extendedWaitUntil:
    notVisible: "Migrate from Old App"
    timeout: 1000
- takeScreenshot:
    path: smoke-launch/migration-dismissed
    label: After migration dialog dismissed
- repeat: # Wait for profile screen to be ready
    times: 3
    while:
      notVisible: "Please create or login to your account."
    commands:
      - extendedWaitUntil:
          visible: "Please create or login to your account."
          timeout: 10000
          optional: true
- takeScreenshot:
    path: smoke-launch/profile-ready
    label: Profile screen ready
