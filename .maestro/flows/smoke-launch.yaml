appId: org.bibletranslationtools.writer
---
- launchApp:
    clearState: true
- runFlow:
    label: Recover from system ANR if shown
    when:
      visible: "isn't responding"
    commands:
      - tapOn:
          text: "Wait"
          waitToSettleTimeoutMs: 500
      - extendedWaitUntil:
          notVisible: "isn't responding"
          timeout: 30000
      - launchApp
- runFlow:
    label: Dismiss slow-device warning if shown
    when:
      visible: "Slow Device"
    commands:
      - tapOn:
          text: "Don't show again"
          waitToSettleTimeoutMs: 200
      - tapOn:
          text: "Continue"
          waitToSettleTimeoutMs: 200
- extendedWaitUntil:
    visible: "Migrate from Old App"
    timeout: 15000
- tapOn:
    text: "No"
    waitToSettleTimeoutMs: 200
- extendedWaitUntil:
    notVisible: "Migrate from Old App"
    timeout: 1000
- extendedWaitUntil:
    visible: "Please create or login to your account."
    timeout: 10000
