appId: org.bibletranslationtools.writer
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Migrate from Old App"
    timeout: 3000
    optional: true
- tapOn:
    text: "No"
    optional: true
    waitToSettleTimeoutMs: 500
- runFlow:
    when:
      visible: "Slow Device"
    commands:
      - tapOn:
          text: "Don't show again"
          waitToSettleTimeoutMs: 500
      - tapOn:
          text: "Continue"
          waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "Create offline Account"
    timeout: 120000
