appId: org.bibletranslationtools.writer
---
- assertVisible: "Start a new translation"
- tapOn: "Start a new translation"
- tapOn: "aaa"
- tapOn: "bible-nt"
- scrollUntilVisible:
    element: "John"
    direction: DOWN
    timeout: 5000
    centerElement: true
- tapOn: "John"
- extendedWaitUntil:
    visible: "Your Translation Projects"
    timeout: 5000
- assertVisible: "John"
- tapOn: "John"
- extendedWaitUntil:
    visible: "Edit Source"
    timeout: 5000
- tapOn: "Edit Source"
- tapOn: "English (en) - Unlocked Literal Bible"
- tapOn: "Confirm"