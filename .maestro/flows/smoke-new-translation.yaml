appId: org.bibletranslationtools.writer
---
- extendedWaitUntil:
    visible: "Start a new translation"
    timeout: 5000
- tapOn:
    text: "Start a new translation"
    waitToSettleTimeoutMs: 200
- tapOn: "aaa"
- tapOn: "bible-nt"
- scrollUntilVisible:
    element: "John"
    direction: DOWN
    timeout: 5000
    centerElement: true
- tapOn: "John"
- extendedWaitUntil:
    visible: "Your Translation Projects"
    timeout: 5000
- assertVisible: "John"
- tapOn: "John"
- extendedWaitUntil:
    visible: "Edit Source"
    timeout: 5000
- tapOn: "Edit Source"
- waitForAnimationToEnd
- assertVisible: "Choose source translations"
- tapOn: "Choose source translations"
- inputText: "English"
- hideKeyboard:
    optional: true
- waitForAnimationToEnd
- assertVisible: "Confirm"
- tapOn: 
    text: "English (en) - Unlocked Literal Bible"
    waitToSettleTimeoutMs: 500
- takeScreenshot: new-translation/01-after-tap-english-source
- tapOn: 
    text: "Confirm"
    waitToSettleTimeoutMs: 500
- takeScreenshot: new-translation/02-after-confirm-download
- retry:
    maxRetries: 3
    commands:
      - assertVisible: "Downloading"
- takeScreenshot: new-translation/03-download-dialog-visible
- extendedWaitUntil:
    notVisible: "Downloading"
    timeout: 60000
- takeScreenshot: new-translation/04-after-download-complete
- tapOn: 
    text: "English (en) - Unlocked Literal Bible"
    waitToSettleTimeoutMs: 500
- takeScreenshot: new-translation/05-after-select-english-source
- tapOn: "Confirm"
- takeScreenshot: new-translation/06-after-confirm-sources