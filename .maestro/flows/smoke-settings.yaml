appId: org.bibletranslationtools.writer
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Migrate from Old App"
    timeout: 120000
    optional: true
- tapOn:
    text: "No"
    optional: true
- runFlow:
    when:
      visible: "Do not show again"
    commands:
      - tapOn: "Do not show again"
      - tapOn: "Continue"
- extendedWaitUntil:
    visible: "Create offline Account"
    timeout: 120000
- tapOn: "Create offline Account"
- tapOn: "Your Name or Pseudonym"
- inputText: "Test User"
- tapOn: "Continue"
- runFlow:
    when:
      visible: "Privacy Notice"
    commands:
      - tapOn: "Continue"
- tapOn: "I Agree"
- extendedWaitUntil:
    visible: "Your Translation Projects"
    timeout: 120000
- tapOn: "More Options"
- tapOn: "Settings"
- assertVisible: "General"
