name: Build

on: [ push, pull_request ]

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096M -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:
  test-android-e2e:
    name: Android E2E (Maestro)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          tool-cache: true
          dotnet: true
          haskell: true
          swap-storage: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Checkout
        uses: actions/checkout@v4

      - name: Gradle setup
        uses: ./.github/actions/gradle-setup

      - name: Run Maestro smoke flows
        id: maestro
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_tablet
          disable-animations: true
          disk-size: 6000M
          ram-size: 4096M
          heap-size: 512M
          emulator-boot-timeout: 900
          pre-emulator-launch-script: bash .github/scripts/setup-android-emulator.sh
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 4096
          script: |
            set -e
            ./gradlew :androidApp:assembleDebug --daemon -PbttE2e=true
            curl -Ls "https://get.maestro.mobile.dev" | bash
            adb install -r androidApp/build/outputs/apk/debug/androidApp-debug.apk
            mkdir -p maestro-artifacts
            set +e
            "$HOME/.maestro/bin/maestro" test --test-output-dir maestro-artifacts --debug-output maestro-artifacts --flatten-debug-output .maestro/flows/smoke.yaml
            MAESTRO_EXIT=$?
            set -e
            exit $MAESTRO_EXIT

      - name: Upload Maestro E2E artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: maestro-e2e-artifacts
          path: maestro-artifacts/
          if-no-files-found: ignore
          retention-days: 2

  test:
    name: Run tests
    runs-on: ubuntu-latest
    needs: test-android-e2e
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gradle setup
        uses: ./.github/actions/gradle-setup

      - name: Run tests
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048M -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          DISPLAY=:99 ./gradlew jvmTest

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: "**/build/reports/tests/"

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gradle setup
        uses: ./.github/actions/gradle-setup

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "ANDROID_KEYSTORE_BASE64 secret not set; APK will be unsigned." >&2
          fi

      - name: Build Android release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ALIAS_NAME }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ALIAS_PASS }}
        run: ./gradlew :androidApp:assembleRelease

      - name: Upload Android release APK
        uses: ./.github/actions/upload-release-artifact
        with:
          source-dir: androidApp/build/outputs/apk/release
          extension: apk
          platform-suffix: android

  build-desktop-macos:
    name: Build Desktop macOS
    runs-on: macos-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gradle setup
        uses: ./.github/actions/gradle-setup

      - name: Build macOS DMG
        run: ./gradlew :composeApp:packageDmg

      - name: Upload macOS DMG
        uses: ./.github/actions/upload-release-artifact
        with:
          source-dir: composeApp/build/compose/binaries/main/dmg
          extension: dmg
          platform-suffix: macos

  build-desktop-windows:
    name: Build Desktop Windows
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gradle setup
        uses: ./.github/actions/gradle-setup

      - name: Build Windows MSI
        run: ./gradlew :composeApp:packageMsi

      - name: Upload Windows MSI
        uses: ./.github/actions/upload-release-artifact
        with:
          source-dir: composeApp/build/compose/binaries/main/msi
          extension: msi
          platform-suffix: windows

  build-desktop-linux:
    name: Build Desktop Linux
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gradle setup
        uses: ./.github/actions/gradle-setup

      - name: Build Linux DEB
        run: ./gradlew :composeApp:packageDeb

      - name: Upload Linux DEB
        uses: ./.github/actions/upload-release-artifact
        with:
          source-dir: composeApp/build/compose/binaries/main/deb
          extension: deb
          platform-suffix: linux