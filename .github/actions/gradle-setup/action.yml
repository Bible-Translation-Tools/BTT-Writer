name: gradle-setup
description: Setup Java and Gradle, refresh bundled resources
runs:
  using: "composite"
  steps:
    - name: Setup Java
      uses: actions/setup-java@v4.0.0
      with:
        java-version: "17"
        distribution: "temurin"
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5.0.0
    - name: Refresh bundled resources
      shell: bash
      run: |
        DIR=composeApp/src/commonMain/composeResources/files
        BASE=https://writer-resources.bibletranslationtools.org
        curl -fsSL -o "$DIR/containers.zip" "$BASE/containers.zip"
        curl -fsSL -o "$DIR/index.sqlite" "$BASE/index.sqlite"